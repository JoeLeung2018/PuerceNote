[package]
name = "flowy-subscription"
version = "0.1.0"
edition = "2021"
description = "PuerceNote subscription, payment, and billing system"
authors = ["PuerceNote Contributors"]
license = "AGPL-3.0"

[dependencies]
# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for external APIs
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
url = "2.5"

# Hashing and cryptography
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"

# Configuration
dotenv = "0.15"
config = "0.13"

# Async trait
async-trait = "0.1"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Date validation
time = "0.3"

# FFI for Flutter
lib-dispatch = { path = "../lib-dispatch" }
flowy-error = { path = "../flowy-error" }

# Database abstraction
lib-infra = { path = "../lib-infra" }
flowy-sqlite = { path = "../flowy-sqlite" }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"
tempfile = "3.8"

[features]
default = []
web3-integration = []  # Placeholder for future Web3 integration
solana-integration = []  # Placeholder for future Solana integration

[[bin]]
name = "subscription_server"
path = "src/bin/server.rs"
required-features = []

[lib]
name = "flowy_subscription"
path = "src/lib.rs"
