[package]
name = "flowy-subscription"
version = "0.1.0"
edition = "2021"
description = "PuerceNote subscription, payment, and billing system"
authors = ["PuerceNote Contributors"]
license = "AGPL-3.0"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for external APIs
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
url = "2.5"

# Hashing and cryptography
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "uuid", "chrono"] }
diesel = { version = "2.1", features = ["sqlite"] }

# Configuration
dotenv = "0.15"
config = "0.13"

# Async trait
async-trait = "0.1"

# Web3 / Blockchain
web3 = { version = "0.21", optional = true }
ethers = { version = "2.0", optional = true }
solana-client = { version = "1.18", optional = true }

# Protobuf
protobuf = "2.28"
protobuf-codegen = "2.28"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Date validation
time = "0.3"

# FFI for Flutter
ffi = { path = "../lib-dispatch", version = "0.1" }
flowy-error = { path = "../flowy-error", version = "0.1" }

# Database abstraction
lib-infra = { path = "../lib-infra", version = "0.1" }
flowy-sqlite = { path = "../flowy-sqlite", version = "0.1" }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"
tempfile = "3.8"

[features]
default = []
web3-integration = ["web3", "ethers"]
solana-integration = ["solana-client"]

[[bin]]
name = "subscription_server"
path = "src/bin/server.rs"
required-features = []

[lib]
name = "flowy_subscription"
path = "src/lib.rs"
